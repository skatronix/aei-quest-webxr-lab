<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>AEI Surface Walker XR 0.1</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;font-family:Arial,sans-serif}canvas{display:block}#hud{position:fixed;left:16px;top:16px;z-index:5;padding:12px 14px;border:1px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(0,0,0,.5);color:#fff;font-size:14px;line-height:1.4;backdrop-filter:blur(8px)}#status{margin-top:6px;color:#7ffcff}</style>
</head>
<body><div id="hud"><b>AEI SURFACE WALKER XR 0.1</b><br>Six walkers trace a gridded cube surface.<div id="status">Ready</div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,50);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,premultipliedAlpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;renderer.setClearColor(0,0);document.body.appendChild(renderer.domElement);document.body.appendChild(ARButton.createButton(renderer,{optionalFeatures:['local-floor']}));
const root=new THREE.Group();root.position.set(0,1.25,-2);scene.add(root);const SIZE=1.4,HALF=SIZE/2,STEP=.07,MAX=110;const box=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(SIZE,SIZE,SIZE)),new THREE.LineBasicMaterial({color:0x335566,transparent:true,opacity:.35}));root.add(box);const cols=[0x00f6ff,0xff00e5,0x8b5cff,0x00ff88,0xffd400,0xff6b35];function snap(v){return Math.round(v/STEP)*STEP}function facePoint(face){let a=(Math.random()*2-1)*HALF,b=(Math.random()*2-1)*HALF;switch(face){case 0:return new THREE.Vector3(HALF,snap(a),snap(b));case 1:return new THREE.Vector3(snap(a),snap(b),-HALF);case 2:return new THREE.Vector3(-HALF,snap(a),snap(b));case 3:return new THREE.Vector3(snap(a),snap(b),HALF);case 4:return new THREE.Vector3(snap(a),-HALF,snap(b));default:return new THREE.Vector3(snap(a),HALF,snap(b));}}
class Walker{constructor(face,i){this.face=face;this.p=facePoint(face);this.path=[this.p.clone()];this.mat=new THREE.LineBasicMaterial({color:cols[i%cols.length],transparent:true,opacity:.9,blending:THREE.AdditiveBlending});this.line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(this.path),this.mat);root.add(this.line);this.choose();}choose(){const axes=this.face===0||this.face===2?['y','z']:this.face===4||this.face===5?['x','z']:['x','y'];this.axis=axes[Math.floor(Math.random()*2)];this.dir=Math.random()<.5?-STEP:STEP;}move(){let q=this.p.clone();q[this.axis]+=this.dir;if(Math.abs(q[this.axis])>HALF+.001){q[this.axis]=Math.sign(q[this.axis])*HALF;this.transition(q);}this.p.copy(q);this.path.push(q.clone());if(this.path.length>MAX)this.path.shift();if(Math.random()<.12)this.choose();this.line.geometry.dispose();this.line.geometry=new THREE.BufferGeometry().setFromPoints(this.path);}transition(q){const x=Math.abs(q.x)>=HALF-.001,y=Math.abs(q.y)>=HALF-.001,z=Math.abs(q.z)>=HALF-.001;if(this.axis==='x')this.face=q.x>0?0:2;else if(this.axis==='y')this.face=q.y>0?5:4;else this.face=q.z>0?3:1;this.choose();}}
const walkers=Array.from({length:6},(_,i)=>new Walker(i,i));let acc=0;renderer.setAnimationLoop((time)=>{if(time-acc>55){walkers.forEach(w=>w.move());acc=time;}root.rotation.y=Math.sin(time*.00015)*.18;renderer.render(scene,camera);});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});navigator.xr?.isSessionSupported('immersive-ar').then(ok=>document.getElementById('status').textContent=ok?'Quest AR ready':'immersive-ar unavailable');
</script></body></html>
