<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>AEI Neural Horizon XR 0.1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050811;font-family:Arial,sans-serif}canvas{display:block}#hud{position:fixed;left:16px;top:16px;z-index:5;padding:12px 14px;border:1px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(0,0,0,.5);color:#fff;font-size:14px;line-height:1.4;backdrop-filter:blur(8px)}#status{margin-top:6px;color:#8fd6ff}
</style>
</head>
<body>
<div id="hud"><b>AEI NEURAL HORIZON XR 0.1</b><br>Trigger = add node<br>Grip = clear last node<div id="status">Ready</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,50);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,premultipliedAlpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.xr.enabled=true; renderer.setClearColor(0x000000,0); document.body.appendChild(renderer.domElement);
document.body.appendChild(ARButton.createButton(renderer,{requiredFeatures:['hit-test'],optionalFeatures:['local-floor']}));

const statusEl=document.getElementById('status');
const root=new THREE.Group(); scene.add(root);
const nodes=[]; const nodeMeshes=[]; const mirrorMeshes=[]; const lineObjects=[]; const threadObjects=[];
let t=0,hitTestSource=null,hitRequested=false; const horizonY=1.15;

function mat(color,opacity=1){return new THREE.MeshBasicMaterial({color,transparent:true,opacity,depthWrite:false,blending:THREE.AdditiveBlending})}
function lineMat(color,opacity=1){return new THREE.LineBasicMaterial({color,transparent:true,opacity,depthWrite:false,blending:THREE.AdditiveBlending})}

const horizonGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-4,horizonY,-2.5),new THREE.Vector3(4,horizonY,-2.5)]);
const horizonLine=new THREE.Line(horizonGeo,lineMat(0xffdc96,.8)); root.add(horizonLine);
const horizonGlow=new THREE.Mesh(new THREE.PlaneGeometry(8,.05),mat(0xffdc96,.08)); horizonGlow.position.set(0,horizonY,-2.5); root.add(horizonGlow);

function addNodeAt(p){
 const base=p.clone(); base.y=Math.max(horizonY+.08,base.y);
 const n={base,phase:Math.random()*Math.PI*2,r:.18+Math.random()*.28,speed:.35+Math.random()*.55,size:.018+Math.random()*.025,pos:base.clone()}; nodes.push(n);
 const upper=new THREE.Mesh(new THREE.SphereGeometry(n.size,12,8),mat(0x78beff,.95)); const lower=new THREE.Mesh(new THREE.SphereGeometry(n.size*.9,12,8),mat(0xffaa5a,.82)); root.add(upper,lower); nodeMeshes.push(upper); mirrorMeshes.push(lower); rebuildConnections();
}

for(let i=0;i<42;i++) addNodeAt(new THREE.Vector3((Math.random()-.5)*3.2,horizonY+.2+Math.random()*1.4,-1.8-Math.random()*2.5));

function rebuildConnections(){lineObjects.forEach(o=>root.remove(o));threadObjects.forEach(o=>root.remove(o));lineObjects.length=0;threadObjects.length=0;for(let i=0;i<nodes.length;i++){for(let j=i+1;j<nodes.length;j++){const a=nodes[i].pos,b=nodes[j].pos;const d=a.distanceTo(b);if(d<.75){const g=new THREE.BufferGeometry().setFromPoints([a.clone(),b.clone()]);const l=new THREE.Line(g,lineMat(0x78beff,Math.max(.06,.55*(1-d/.75))));root.add(l);lineObjects.push(l);const ar=new THREE.Vector3(a.x,2*horizonY-a.y,a.z),br=new THREE.Vector3(b.x,2*horizonY-b.y,b.z);const gm=new THREE.BufferGeometry().setFromPoints([ar,br]);const lm=new THREE.Line(gm,lineMat(0xffaa5a,Math.max(.04,.42*(1-d/.75))));root.add(lm);lineObjects.push(lm);}}const p=nodes[i].pos;const rp=new THREE.Vector3(p.x,2*horizonY-p.y,p.z);const tg=new THREE.BufferGeometry().setFromPoints([p.clone(),rp]);const th=new THREE.Line(tg,lineMat(0xffffff,.10));root.add(th);threadObjects.push(th);}}

const controller=renderer.xr.getController(0);scene.add(controller);
controller.addEventListener('select',()=>{const p=new THREE.Vector3(0,0,-1.6).applyMatrix4(controller.matrixWorld);addNodeAt(p);statusEl.textContent=`${nodes.length} nodes`;});
controller.addEventListener('squeeze',()=>{if(nodes.length<=1)return;nodes.pop();const u=nodeMeshes.pop(),m=mirrorMeshes.pop();root.remove(u,m);rebuildConnections();statusEl.textContent=`${nodes.length} nodes`;});

const reticle=new THREE.Mesh(new THREE.RingGeometry(.025,.035,32).rotateX(-Math.PI/2),mat(0x78beff,.9));reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);

renderer.setAnimationLoop((time,frame)=>{
 t=time*.001;
 nodes.forEach((n,i)=>{n.pos.set(n.base.x+Math.cos(t*n.speed*2+n.phase)*n.r*.25,n.base.y+Math.sin(t*n.speed*3+n.phase)*n.r*.18,n.base.z);nodeMeshes[i].position.copy(n.pos);mirrorMeshes[i].position.set(n.pos.x,2*horizonY-n.pos.y,n.pos.z);});
 rebuildConnections();
 const session=renderer.xr.getSession(); if(frame&&session){const ref=renderer.xr.getReferenceSpace(); if(!hitRequested){session.requestReferenceSpace('viewer').then(v=>session.requestHitTestSource({space:v}).then(s=>hitTestSource=s));hitRequested=true;} if(hitTestSource){const hits=frame.getHitTestResults(hitTestSource);if(hits.length){const pose=hits[0].getPose(ref);reticle.visible=true;reticle.matrix.fromArray(pose.transform.matrix);}else reticle.visible=false;}}
 renderer.render(scene,camera);
});

renderer.xr.addEventListener('sessionend',()=>{hitTestSource=null;hitRequested=false;reticle.visible=false;});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
if(navigator.xr)navigator.xr.isSessionSupported('immersive-ar').then(ok=>statusEl.textContent=ok?'Quest AR ready':'immersive-ar unavailable');
</script>
</body>
</html>
