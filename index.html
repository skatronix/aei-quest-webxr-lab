<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
  />
  <meta name="theme-color" content="#030507" />
  <title>AEI Spatial Mapper 0.1</title>
</head>

<body>
  <main id="app">
    <section class="panel">
      <p class="eyebrow">AEI XR LAB / QUEST 2</p>

      <h1>Spatial Mapper 0.1</h1>

      <p>
        Place four spatial corner points to create
        a projection-mapping surface.
      </p>

      <div id="support" class="status">
        Checking WebXR…
      </div>

      <div class="actions">
        <button id="enter-ar" disabled>
          ENTER MR / AR
        </button>

        <button id="enter-vr" disabled>
          ENTER VR
        </button>
      </div>

      <p class="hint">
        Hand pinch or Touch trigger = place corner.
        Place points clockwise:
        top-left → top-right → bottom-right → bottom-left.
        Touch grip = reset.
      </p>
    </section>
  </main>

  <canvas id="xr-canvas"></canvas>

  <script
    type="module"
    src="/src/main.js">
  </script>
</body>
</html>
