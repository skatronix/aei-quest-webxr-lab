<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="theme-color" content="#030407" />
  <title>AEI Air Harp 0.1.2</title>
</head>
<body>
  <main id="app">
    <section class="panel">
      <p class="eyebrow">AEI XR LAB / QUEST 2</p>
      <h1>Air Harp 0.1.2</h1>
      <p>Five spatial strings. Move an index fingertip through a string to pluck it.</p>
      <div id="support" class="status">Checking WebXR…</div>
      <div class="actions">
        <button id="enter-ar" disabled>ENTER MR / AR</button>
        <button id="enter-vr" disabled>ENTER VR</button>
      </div>
      <p class="hint">Hands preferred. Touch controllers fall back to controller-tip interaction.</p>
    </section>
  </main>
  <canvas id="xr-canvas"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
