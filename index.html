<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta
      name="description"
      content="AEI Quest WebXR Lab — privacy-first WebXR diagnostics for Meta Quest 2."
    />
    <title>AEI Quest WebXR Lab</title>
  </head>
  <body>
    <main id="app">
      <section class="panel">
        <p class="eyebrow">AEI XR / MR LAB</p>
        <h1>Quest WebXR Demo 01</h1>
        <p>
          Minimal WebXR diagnostic: headset tracking, Touch input and hand-input detection.
          No Meta SDK, analytics or application telemetry.
        </p>

        <div id="support" class="status">Checking WebXR support…</div>

        <div class="actions">
          <button id="enter-vr" disabled>ENTER VR</button>
          <button id="enter-ar" disabled>ENTER MR / AR</button>
        </div>

        <p class="hint">
          Quest 2: open this page in Meta Quest Browser. If MR/AR is unavailable, use VR.
        </p>
      </section>
    </main>
    <canvas id="xr-canvas"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
