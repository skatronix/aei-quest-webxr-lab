<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AEI Spatial Neon v0.2 Manipulation</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:Arial,sans-serif}
    canvas{display:block}
    #hud{position:fixed;left:16px;top:16px;z-index:5;padding:12px 14px;border:1px solid rgba(255,255,255,.25);border-radius:12px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:1.4;backdrop-filter:blur(8px);max-width:350px}
    #hud b{letter-spacing:.08em}.muted{opacity:.72}#status{margin-top:7px;color:#7ffcff}
  </style>
</head>
<body>
  <div id="hud">
    <b>AEI SPATIAL NEON v0.2</b><br>
    <span class="muted">Trigger empty surface = add corner<br>
    Trigger-hold corner = grab + move<br>
    Hand pinch corner = grab + move<br>
    Grip = undo<br>
    Thumbstick L/R = colour</span>
    <div id="status">Ready</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';

    const statusEl=document.getElementById('status');
    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,50);
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,premultipliedAlpha:false});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.xr.enabled=true; renderer.setClearColor(0x000000,0); document.body.appendChild(renderer.domElement);
    document.body.appendChild(ARButton.createButton(renderer,{requiredFeatures:['hit-test'],optionalFeatures:['local-floor','plane-detection','hand-tracking']}));

    const COLORS=[0x00f6ff,0xff00e5,0x8b5cff,0x00ff88,0xffd400];
    let colorIndex=0, neonColor=new THREE.Color(COLORS[0]);
    const points=[], nodeMeshes=[], neonObjects=[];
    let grid=null, hitTestSource=null, hitTestSourceRequested=false;
    const raycaster=new THREE.Raycaster();
    const tempM=new THREE.Matrix4(), tempV=new THREE.Vector3(), tempQ=new THREE.Quaternion();

    const reticle=new THREE.Mesh(new THREE.RingGeometry(.025,.035,48).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:neonColor,transparent:true,opacity:.95,depthTest:false,blending:THREE.AdditiveBlending}));
    reticle.matrixAutoUpdate=false; reticle.visible=false; scene.add(reticle);

    const controllers=[renderer.xr.getController(0),renderer.xr.getController(1)];
    const controllerState=[{grab:-1,distance:1},{grab:-1,distance:1}];
    controllers.forEach((c,i)=>{scene.add(c); addRay(c); c.addEventListener('selectstart',()=>controllerSelectStart(i)); c.addEventListener('selectend',()=>controllerSelectEnd(i)); c.addEventListener('squeeze',undoPoint);});

    function addRay(c){const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-1)]);const m=new THREE.LineBasicMaterial({color:neonColor,transparent:true,opacity:.55,blending:THREE.AdditiveBlending});const r=new THREE.Line(g,m);r.scale.z=3;r.name='ray';c.add(r)}
    function neonMat(op=1){return new THREE.MeshBasicMaterial({color:neonColor,transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending})}

    function controllerRay(i){const c=controllers[i]; tempM.identity().extractRotation(c.matrixWorld); const origin=new THREE.Vector3().setFromMatrixPosition(c.matrixWorld); const dir=new THREE.Vector3(0,0,-1).applyMatrix4(tempM).normalize(); return {origin,dir}}
    function pickNodeByRay(i){if(!nodeMeshes.length)return null;const r=controllerRay(i);raycaster.set(r.origin,r.dir);raycaster.far=5;const hits=raycaster.intersectObjects(nodeMeshes,false);return hits[0]||null}

    function controllerSelectStart(i){const hit=pickNodeByRay(i); if(hit){const idx=hit.object.userData.pointIndex; const r=controllerRay(i); controllerState[i].grab=idx; controllerState[i].distance=Math.max(.08,r.origin.distanceTo(points[idx])); statusEl.textContent=`Grabbed corner ${idx+1}`; highlightNode(idx,true); return;} if(reticle.visible){const p=new THREE.Vector3().setFromMatrixPosition(reticle.matrix); points.push(p); rebuildNeon(); statusEl.textContent=`${points.length} corners mapped`;}}
    function controllerSelectEnd(i){const idx=controllerState[i].grab;if(idx>=0)highlightNode(idx,false);controllerState[i].grab=-1}
    function updateControllerGrab(i){const s=controllerState[i];if(s.grab<0)return;const r=controllerRay(i);points[s.grab].copy(r.origin).addScaledVector(r.dir,s.distance);rebuildGeometryOnly();}

    function undoPoint(){if(!points.length)return;points.pop();rebuildNeon();statusEl.textContent=`${points.length} corners mapped`}

    function makeSegment(a,b){const d=new THREE.Vector3().subVectors(b,a),len=d.length();if(len<.002)return null;const core=new THREE.Mesh(new THREE.CylinderGeometry(.007,.007,len,8,1,true),neonMat(.98));core.position.copy(a).add(b).multiplyScalar(.5);core.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());const glow=new THREE.Mesh(new THREE.CylinderGeometry(.022,.022,len,8,1,true),neonMat(.12));glow.position.copy(core.position);glow.quaternion.copy(core.quaternion);const g=new THREE.Group();g.add(glow,core);return g}

    function makeNode(p,i){const core=new THREE.Mesh(new THREE.SphereGeometry(.038,16,12),neonMat(.98));core.position.copy(p);core.userData.pointIndex=i;core.userData.isNode=true;const glow=new THREE.Mesh(new THREE.SphereGeometry(.085,16,12),neonMat(.13));glow.position.copy(p);const ring=new THREE.Mesh(new THREE.TorusGeometry(.06,.006,8,32),neonMat(.85));ring.position.copy(p);ring.lookAt(camera.position);scene.add(glow,ring,core);nodeMeshes.push(core);neonObjects.push(glow,ring,core)}

    function clearGeometry(){neonObjects.forEach(o=>scene.remove(o));neonObjects.length=0;nodeMeshes.length=0;if(grid){scene.remove(grid);grid=null}}
    function rebuildNeon(){clearGeometry();points.forEach((p,i)=>makeNode(p,i));for(let i=1;i<points.length;i++){const s=makeSegment(points[i-1],points[i]);if(s){scene.add(s);neonObjects.push(s)}}if(points.length>=4){const s=makeSegment(points[3],points[0]);if(s){scene.add(s);neonObjects.push(s)}buildFloorGrid(points.slice(0,4))}}
    function rebuildGeometryOnly(){rebuildNeon()}

    function buildFloorGrid(fp){const minX=Math.min(...fp.map(p=>p.x)),maxX=Math.max(...fp.map(p=>p.x)),minZ=Math.min(...fp.map(p=>p.z)),maxZ=Math.max(...fp.map(p=>p.z)),y=fp.reduce((s,p)=>s+p.y,0)/fp.length;const size=Math.max(maxX-minX,maxZ-minZ,.5),div=Math.max(4,Math.min(30,Math.round(size/.25)));grid=new THREE.GridHelper(size,div,neonColor,neonColor);grid.material.transparent=true;grid.material.opacity=.23;grid.material.depthWrite=false;grid.material.blending=THREE.AdditiveBlending;grid.position.set((minX+maxX)/2,y+.005,(minZ+maxZ)/2);scene.add(grid)}

    function highlightNode(idx,on){const n=nodeMeshes.find(n=>n.userData.pointIndex===idx);if(n)n.scale.setScalar(on?1.7:1)}

    const handState=new Map();
    function updateHands(frame,refSpace,session){for(const src of session.inputSources){if(!src.hand)continue;const thumb=src.hand.get('thumb-tip'),index=src.hand.get('index-finger-tip');if(!thumb||!index)continue;const tp=frame.getJointPose(thumb,refSpace),ip=frame.getJointPose(index,refSpace);if(!tp||!ip)continue;const a=new THREE.Vector3(tp.transform.position.x,tp.transform.position.y,tp.transform.position.z);const b=new THREE.Vector3(ip.transform.position.x,ip.transform.position.y,ip.transform.position.z);const pinchPoint=a.clone().add(b).multiplyScalar(.5);const pinching=a.distanceTo(b)<.032;let st=handState.get(src);if(!st){st={was:false,grab:-1};handState.set(src,st)}if(pinching&&!st.was){let best=-1,bestD=.14;points.forEach((p,i)=>{const d=p.distanceTo(pinchPoint);if(d<bestD){bestD=d;best=i}});if(best>=0){st.grab=best;highlightNode(best,true);statusEl.textContent=`Hand grabbed corner ${best+1}`}}if(pinching&&st.grab>=0){points[st.grab].copy(pinchPoint);rebuildGeometryOnly()}if(!pinching&&st.was){if(st.grab>=0)highlightNode(st.grab,false);st.grab=-1}st.was=pinching}}

    function setColor(i){colorIndex=(i+COLORS.length)%COLORS.length;neonColor.setHex(COLORS[colorIndex]);reticle.material.color.copy(neonColor);controllers.forEach(c=>{const r=c.getObjectByName('ray');if(r)r.material.color.copy(neonColor)});rebuildNeon();statusEl.textContent=`Colour ${colorIndex+1}/${COLORS.length}`}
    const axisLatch=new Map();function pollThumbsticks(){[0,1].forEach(i=>{const src=renderer.xr.getSession()?.inputSources?.[i],gp=src?.gamepad;if(!gp)return;const x=gp.axes[2]??gp.axes[0]??0,l=axisLatch.get(i)||false;if(!l&&Math.abs(x)>.75){setColor(colorIndex+(x>0?1:-1));axisLatch.set(i,true)}else if(Math.abs(x)<.35)axisLatch.set(i,false)})}

    renderer.xr.addEventListener('sessionend',()=>{hitTestSource=null;hitTestSourceRequested=false;reticle.visible=false;handState.clear();controllerState.forEach(s=>s.grab=-1);statusEl.textContent='XR session ended'});

    renderer.setAnimationLoop((t,frame)=>{const session=renderer.xr.getSession();if(frame&&session){const ref=renderer.xr.getReferenceSpace();if(!hitTestSourceRequested){session.requestReferenceSpace('viewer').then(v=>session.requestHitTestSource({space:v}).then(s=>hitTestSource=s));hitTestSourceRequested=true}if(hitTestSource){const hits=frame.getHitTestResults(hitTestSource);if(hits.length){const pose=hits[0].getPose(ref);reticle.visible=true;reticle.matrix.fromArray(pose.transform.matrix)}else reticle.visible=false}updateControllerGrab(0);updateControllerGrab(1);updateHands(frame,ref,session);pollThumbsticks()}renderer.render(scene,camera)});

    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
    if(navigator.xr)navigator.xr.isSessionSupported('immersive-ar').then(ok=>statusEl.textContent=ok?'Quest AR ready — map or grab a corner':'immersive-ar not available');else statusEl.textContent='WebXR unavailable';
  </script>
</body>
</html>
